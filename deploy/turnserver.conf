# coturn config for zeronoise with time-limited credentials (TURN REST API / "use-auth-secret").
# The app mints credentials in /api/ice: username "<unix-expiry>:<user-id>", password = base64(HMAC-SHA1(secret, username)).
# static-auth-secret MUST equal the app's TURN_SECRET. Generate one with:  openssl rand -hex 32
#
# Install: apt install coturn; copy this to /etc/turnserver.conf; edit the CHANGE_ME lines;
# set TURNSERVER_ENABLED=1 in /etc/default/coturn (older packages); systemctl restart coturn.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TO_THE_SAME_VALUE_AS_TURN_SECRET
realm=turn.nano11bravo.com
server-name=turn.nano11bravo.com

# Behind a home router (NAT): public IP / LAN IP of this server. Required, or relayed media goes nowhere.
# If your public IP changes, update this (or script it from a DDNS lookup) and restart coturn.
external-ip=CHANGE_ME_PUBLIC_IP/10.0.10.55

# Relay port range - forward these UDP ports on the router to this server (widen for more users;
# each relayed stream uses a port).
min-port=49160
max-port=49200

# Abuse limits
total-quota=100
user-quota=12
max-bps=3000000
stale-nonce=600

# Don't let the relay be used to reach private networks / the host itself
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli
no-tlsv1
no-tlsv1_1

# TURN over TLS (turns:turn.nano11bravo.com:5349) - helps on networks that block UDP.
# Point these at a certificate for turn.nano11bravo.com (e.g. certbot certonly --standalone -d turn.nano11bravo.com,
# or a DNS-01 challenge). Cloudflare origin certificates will NOT work here (browsers don't trust them).
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

log-file=syslog
simple-log
